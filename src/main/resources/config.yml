# ============================================================
#  DayEdit - Configuracion
#  Todo lo que ves aqui es editable: mensajes, menus, lores
#  predefinidos y tematicas.
#
#  OJO: los nombres (hex/degradados) de los personajes de cada
#  tematica YA NO se editan aqui. Se editan en el codigo, en
#  TematicaNombres.java (se sube un commit a GitHub y listo).
#  Aca solo se configura el slot, material, textura/jugador de
#  la cabeza y la navegacion del menu.
# ============================================================

author: "SoyBughatti"

prefix: "&#00DAFF[DayEdit] &f"

mensajes:
  sin-item: "&cDebes tener un item en la mano principal."
  sin-permiso: "&cNo tienes permiso para usar este comando."
  lore-agregado: "&aAgregaste una linea al lore."
  lore-eliminado: "&aUltima linea de lore eliminada."
  lore-limpiado: "&aLore limpiado por completo."
  lore-linea-set: "&aLinea de lore #%linea% actualizada."
  lore-linea-invalida: "&cEsa linea de lore no existe."
  nombre-cambiado: "&aNombre del item actualizado."
  encantamiento-agregado: "&aEncantamiento %encant% nivel %nivel% agregado."
  encantamiento-invalido: "&cEncantamiento invalido: %encant%"
  encantamiento-quitado: "&aEncantamiento %encant% quitado."
  encantamiento-no-tiene: "&cEl item no tiene ese encantamiento."
  encantamientos-limpiados: "&aTodos los encantamientos fueron quitados."
  reload-exitoso: "&aConfiguracion Recargada."
  comando-desconocido: "&cComando desconocido. Usa /dayedit help"
  lore-menu-agregado: "&aAgregaste esa linea de lore predefinida a tu item."
  tematica-aplicada: "&aLe aplicaste el nombre de &f%personaje% &aa tu item."
  solo-jugadores: "&cEste comando solo puede ser usado por jugadores."
  categoria-lore-aplicado: "&aLe aplicaste &f%categoria% %valor% &aa tu item."
  categoria-lore-personalizado-aplicado: "&aLe aplicaste el lore de &f%categoria% &apersonalizado a tu item."
  categoria-invalida: "&cEsa categoria de lore no existe."
  tematica-invalida: "&cEsa tematica o personaje no existe."
  uso-setlore: "&cUso: /dayedit setlore <categoria> <valor(es)>"
  uso-settematica: "&cUso: /dayedit settematica <tematica> <personaje>"
  valor-fuera-de-rango: "&cEse valor esta fuera de rango."

# Lista de comandos que se muestra en /dayedit help
ayuda:
  comandos:
    - comando: "/dayedit"
      descripcion: "Abre el menu principal de DayEdit"
    - comando: "/dayedit lore add <texto>"
      descripcion: "Agrega una linea de lore al item en tu mano"
    - comando: "/dayedit lore remove"
      descripcion: "Elimina la ultima linea de lore del item"
    - comando: "/dayedit lore set <linea> <texto>"
      descripcion: "Reemplaza una linea especifica del lore"
    - comando: "/dayedit lore clear"
      descripcion: "Elimina todo el lore del item"
    - comando: "/dayedit name <texto>"
      descripcion: "Cambia el nombre del item en tu mano"
    - comando: "/dayedit enchant add <encant> [nivel]"
      descripcion: "Agrega un encantamiento al item"
    - comando: "/dayedit enchant remove <encant>"
      descripcion: "Quita un encantamiento especifico del item"
    - comando: "/dayedit enchant clear"
      descripcion: "Quita todos los encantamientos del item"
    - comando: "/dayedit setlore <categoria> <valor(es)>"
      descripcion: "Aplica un lore de categoria sin abrir el menu (ej: /de setlore afilado 255)"
    - comando: "/dayedit settematica <tematica> <personaje>"
      descripcion: "Aplica el nombre de un personaje sin abrir el menu (ej: /de settematica brawlstars shelly)"
    - comando: "/dayedit reload"
      descripcion: "Recarga la configuracion del plugin"
    - comando: "/dayedit help"
      descripcion: "Muestra esta lista de comandos"

# ============================================================
#  MENU PRINCIPAL -> se abre con /dayedit
# ============================================================
menu-principal:
  titulo: "&#00DAFF&lDayEdit &f- Menu Principal"
  tamano: 54
  material-relleno: GRAY_STAINED_GLASS_PANE
  items:
    lores:
      slot: 29
      material: PAPER
      nombre: "&a&lMenu de Lores"
      lore:
        - "&7Click para ver lores"
        - "&7predefinidos y aplicarlos"
        - "&7al item en tu mano."
    tematicas:
      slot: 33
      material: NETHER_STAR
      nombre: "&d&lMenu de Tematicas"
      lore:
        - "&7Click para ver las"
        - "&7tematicas disponibles"
        - "&7para tus items."

# ============================================================
#  MENU DE LORES -> selector de categoria. Cada categoria abre
#  su propio menu paginado (definido mas abajo como
#  categoria-lore-<clave>) con los valores correspondientes.
# ============================================================
menu-lores:
  titulo: "&#00DAFF&lDayEdit &f- Lores"
  tamano: 54
  material-relleno: GRAY_STAINED_GLASS_PANE
  volver-slot: 49
  categorias:
    afilado:
      slot: 29
      material: DIAMOND_SWORD
      nombre: "&b&lAfilado"
      lore:
        - "&7Lores de Sharpness"
        - "&7del 1 al 255"
    proteccion:
      slot: 31
      material: SHIELD
      nombre: "&a&lProteccion"
      lore:
        - "&7Lores de Protection"
        - "&7del 1 al 255"
    atributos:
      slot: 33
      material: NETHER_STAR
      nombre: "&d&lAtributos"
      lore:
        - "&7Lore con Protection +"
        - "&7Vida, Velocidad y Daño"

# ============================================================
#  CATEGORIAS SIMPLES (un solo valor, placeholder %valor%)
#  - material-relleno: item usado para decorar los bordes
#  - material-valor: item usado para cada numero
#  - plantilla: el lore completo que se le pondra al item,
#    %valor% se reemplaza por el numero elegido (reemplaza
#    TODO el lore actual del item, no lo agrega al final)
#  - anterior-slot / siguiente-slot / volver-slot: botones
#    de navegacion (van en la fila de abajo, el borde)
# ============================================================
categoria-lore-afilado:
  titulo: "&#00DAFF&lDayEdit &f- Afilado"
  tamano: 54
  material-relleno: GRAY_STAINED_GLASS_PANE
  material-valor: ENCHANTED_BOOK
  minimo: 1
  maximo: 255
  anterior-slot: 48
  volver-slot: 49
  siguiente-slot: 50
  plantilla:
    - "&8Armamento"
    - " "
    - "&8| &7Encantamientos:"
    - "&8 &8 &8• &fSharpness %valor%"
    - " "
    - "&9Irrompible"

categoria-lore-proteccion:
  titulo: "&#00DAFF&lDayEdit &f- Proteccion"
  tamano: 54
  material-relleno: GRAY_STAINED_GLASS_PANE
  material-valor: ENCHANTED_BOOK
  minimo: 1
  maximo: 255
  anterior-slot: 48
  volver-slot: 49
  siguiente-slot: 50
  plantilla:
    - "&8Equipamiento"
    - " "
    - "&8| &7Encantamientos:"
    - "&8 &8 &8• &fProtection %valor%"
    - " "
    - "&9Irrompible"

# ============================================================
#  CATEGORIA CON CAMPOS MULTIPLES (varios valores en un mismo
#  lore). El jugador va eligiendo un valor por campo, en el
#  orden en que estan escritos aqui, y al final se arma el
#  lore completo reemplazando %clave-del-campo% por lo elegido.
#  - minimo / maximo / paso: rango y salto de cada campo
#  - decimales: cuantos decimales mostrar (0 = numero entero)
# ============================================================
categoria-lore-atributos:
  titulo: "&#00DAFF&lDayEdit &f- Atributos"
  tamano: 54
  material-relleno: GRAY_STAINED_GLASS_PANE
  material-valor: NETHER_STAR
  anterior-slot: 48
  volver-slot: 49
  siguiente-slot: 50
  plantilla:
    - "&8Equipamiento"
    - " "
    - "&8| &7Encantamientos:"
    - "&8 &8 &8• &fProtection %protection%"
    - " "
    - "&8| &7Atributos:"
    - "&8 &8 &8• &cVida (+%vida%) ❤"
    - "&8 &8 &8• &bVelo (+%velo%) ☄"
    - "&8 &8 &8● &4Daño (+%dano%) 🗡"
    - " "
    - "&9Irrompible"
  campos:
    protection:
      nombre: "&fProtection"
      minimo: 1
      maximo: 255
      paso: 1
      decimales: 0
    vida:
      nombre: "&cVida"
      minimo: 0.5
      maximo: 100
      paso: 0.5
      decimales: 1
    velo:
      nombre: "&bVelo"
      minimo: 0.01
      maximo: 0.02
      paso: 0.01
      decimales: 2
    dano:
      nombre: "&4Daño"
      minimo: 0.1
      maximo: 20
      paso: 0.1
      decimales: 1

# ============================================================
#  MENU DE TEMATICAS -> cada entrada abre su propio submenu
